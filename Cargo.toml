[package]
name = "envscanner"
version = "0.1.0"
edition = "2021"
description = "Multi-threaded .env exposure scanner (authorized use only)"
license = "MIT"
repository = "https://github.com/Se-ve-n/envscanner"
homepage = "https://github.com/Se-ve-n/envscanner"
readme = "README.md"
keywords = ["security", "scanner", "env", "secrets", "pentest"]
categories = ["command-line-utilities"]

[[bin]]
name = "envscanner"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.37", features = ["full"] }
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
once_cell = "1.19"
colored = "2.1"
anyhow = "1.0"
async-channel = "2.3"
futures = "0.3"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"